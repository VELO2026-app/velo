# velo on the deploy machine pridem: what to install, never a value
# (contract 3; PRIMER-PROTOCOL 1.6). Values come from the instance's passport
# and from the machine only (protocol 5.1).
schema: 1
name: velo
kind: product

dependencies:
  comms: { repo: git@github.com:aivis-one/comms.git, version: ">=4,<5" }

editions:
  # One edition, `ai` (owner ruling 5.11); its modules are the table
  # editions.json at the repository root, whose keys are these (backend
  # tests/test_report.py).
  ai: { services: [comms] }

# Instance options (protocol 5.2.3, BE-182): the passport turns on a subset;
# each reaches the backend as the flag OPTION_<NAME> below. telegram is
# required -- velo has no sign-in without it, and the machine refuses a
# passport with it off.
options: [payments, schools, mcp, zoom, telegram, llm]
options_required: [telegram]

stacks:
  velo:
    compose: docker-compose.yml
    app:      { service: app, port: 8000, health: /health, ready: /ready }
    frontend: { service: frontend, port: 3000 }
    migrate:  python -m alembic upgrade head
    test:     { run: python -m pytest tests/ --junitxml=/tmp/junit.xml, target: test }
    seeds:
      02102026-demo:            { run: python scripts/seed.py --profile 02102026-demo, when: command }
      02102026-invest_demo_new: { run: python scripts/seed.py --profile 02102026-invest_demo_new, when: command }
      11102026-loadtest:        { run: python scripts/seed.py --profile 11102026-loadtest, when: command }
      "15082026":               { run: python scripts/seed.py --profile 15082026, when: command }
      23092026-cf-388101:       { run: python scripts/seed.py --profile 23092026-cf-388101, when: command }
      "26082026":               { run: python scripts/seed.py --profile 26082026, when: command }
      26082026-1:               { run: python scripts/seed.py --profile 26082026-1, when: command }
      FE-54:                    { run: python scripts/seed.py --profile FE-54, when: command }
  velo-storage:
    compose: docker-compose.storage.yml
    persistent: true

env:
  # minted: the machine mints once, the value lives between rollouts
  POSTGRES_PASSWORD:    { source: minted }
  REDIS_PASSWORD:       { source: minted }
  STORAGE_SECRET_KEY:   { source: minted }
  RUSTFS_ACCESS_KEY:    { source: minted }
  RUSTFS_SECRET_KEY:    { source: minted }
  # passport
  EDITION:              { source: passport, key: edition, enum: editions }
  SERVER_ROLE:          { source: passport, key: server.role }
  DOMAIN_FRONTEND:      { source: passport, key: domains.frontend }
  DOMAIN_API:           { source: passport, key: domains.api }
  API_BASE_URL:         { source: passport, key: domains.api }
  OPTION_PAYMENTS:      { source: passport, key: options.payments }
  OPTION_SCHOOLS:       { source: passport, key: options.schools }
  OPTION_MCP:           { source: passport, key: options.mcp }
  OPTION_ZOOM:          { source: passport, key: options.zoom }
  OPTION_TELEGRAM:      { source: passport, key: options.telegram }
  OPTION_LLM:           { source: passport, key: options.llm }
  # params.velo.<name> of the passport
  # `when: <option>`: with the option off the machine passes its literal
  # and the backend neither checks nor reads the variable (protocol 5.2.3).
  SUPPORT_LANGUAGE:         { source: param }
  ZOOM_ACCOUNT_ID:          { source: param, when: zoom }
  ZOOM_CLIENT_ID:           { source: param, when: zoom }
  ZOOM_SDK_CLIENT_ID:       { source: param, when: zoom }
  TELEGRAM_LOGIN_CLIENT_ID: { source: param, when: telegram }
  # asked: secrets of the passport
  ZOOM_CLIENT_SECRET:           { source: asked, when: zoom }
  ZOOM_SDK_CLIENT_SECRET:       { source: asked, when: zoom }
  TELEGRAM_LOGIN_CLIENT_SECRET: { source: asked, when: telegram }
  TELEGRAM_BOT_TOKEN:           { source: asked, when: telegram }
  # seams of comms
  COMMS_API_URL:         { source: seam, from: comms }
  COMMS_SERVICE_TOKEN:   { source: seam, from: comms }
  TELEGRAM_BOT_URL:      { source: seam, from: comms }
  COMMS_EVENTS_ADDRESS:  { source: seam, from: comms }
  COMMS_EVENTS_PASSWORD: { source: seam, from: comms }

packages:
  skin:
    contract: ">=1,<2"
    apply: build
    build:
      - { service: frontend, path: public/skin }

# In transition (protocol 4.2, 11.2): each host leaves with its channel.
# A host opens only while one of its options is on (protocol 4.2).
egress:
  - { host: zoom.us, when: [zoom] }                  # Zoom, until velo-meet
  - { host: api.zoom.us, when: [zoom] }              # Zoom, until velo-meet
  - { host: oauth.telegram.org, when: [telegram] }   # sign-in, until comms v4.x
  - { host: claude.ai, when: [mcp] }                 # MCP CIMD, until comms v4.x
  - { host: chatgpt.com, when: [mcp] }               # MCP CIMD, until comms v4.x

host:
  domains: [frontend, api]
  routes:
    frontend: { to: "frontend:3000" }
    api:      { to: "app:8000", max_body: 3M }

verbs:
  setrole:        { run: python scripts/set_role.py --yes, args: [telegram_id, role] }
  comms-outbox:   { run: python scripts/comms_outbox.py, args: [command] }
  backfill-comms: { run: python scripts/backfill_comms_sync.py }

report: { health: /health, ready: /ready, logs: json, junit: true }
