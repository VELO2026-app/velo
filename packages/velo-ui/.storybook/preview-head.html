<!-- The showcase host typography: the app's --font-body token. The core is
     neutral since FE-230 -- the system font stack, no webfont, no external
     request; a skin's self-hosted font belongs to its package and a skinned
     app build, not to this showcase. -->
<style>
  /* The app's global.css applies the font token to body; the showcase
     imports only variables.css (tokens), so the host typography contract is
     repeated HERE -- without it every story inherits the browser default
     (Times), which is exactly "не соответствует реальности". */
  body {
    font-family: var(--font-body, system-ui, sans-serif);
  }
</style>
