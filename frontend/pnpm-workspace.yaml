# pnpm settings (pnpm >= 10 reads config from this file, not package.json).
# Dependency build-script allowlist; packages not listed stay unexecuted.
allowBuilds:
  # Its postinstall only prints a notice (read 2026-10-15) -- nothing to run.
  '@zoom/meetingsdk': false
  esbuild: true
  vue-demi: true
# Pinned past the Dependabot highs (FE-105): the audit needs these exact
# floors, while the newest releases above them (vite 6.4.5, 2026-10-21;
# serialize-javascript 7.1.4, 2026-10-23; postcss-selector-parser 7.1.7,
# 2026-10-20) are younger than the two-week maturity rule. Revisit when
# they age past it. postcss-selector-parser is scoped: eslint-plugin-vue
# declares ^6, the stylelint chain already resolves 7.1.7 on its own.
overrides:
  vite: 6.4.4
  serialize-javascript: 7.1.3
  eslint-plugin-vue>postcss-selector-parser: 7.1.6
