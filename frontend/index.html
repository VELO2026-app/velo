<!doctype html>
<!-- tz-whitelabel §2.2/§3: passport values arrive as %VITE_*% placeholders
     (Vite replaces defined env vars natively); an UNdefined var must not ship
     the literal -- vite.config.ts resolves the rest to the golden defaults.
     %VELO_THEME_COLOR% and the VELO:FONT block are the SKIN derivatives
     (§1/§3): materialized at build time from skin/brand.json by
     platform/passport-html.ts -- brand.json is the SINGLE header-color source
     (§1); without a skin both stay the golden defaults. -->
<html lang="%VITE_DEFAULT_LOCALE%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="%VELO_THEME_COLOR%" />

    <!-- VELO:FONT (tz-whitelabel §3): a skin's webfont replaces everything
         between the markers at build time (platform/passport-html.ts reads
         skin/brand.json fontUrl); without a skin this stays Marmelad. -->
    <!--VELO:FONT-->
    <!-- Google Fonts: preconnect + link (10.6: replaces @import in global.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Marmelad&display=swap" rel="stylesheet" />
    <!--/VELO:FONT-->

    <!-- Telegram WebApp SDK: NOT here. src/platform/launch.ts loads it, and
         only when Telegram launched the app (BE-149); a browser or the
         installed app never requests the Telegram CDN. -->

    <!-- PWA (BE-149). The manifest link tag is injected by VitePWA from
         src/pwa/manifest.ts -- do not add one here. viewport-fit=cover is
         appended at runtime OUTSIDE Telegram only (src/platform/launch.ts),
         so the Telegram webview keeps this viewport tag byte-for-byte. -->
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <!-- iOS home-screen icon: opaque 180x180 (iOS paints transparency black). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Status bar drawn OVER the app in the installed iOS app; the top
         clearance comes from env(safe-area-inset-top) (useSafeArea.ts). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>%VITE_BRAND%</title>
  </head>
  <body>
    <!-- PROMPT №383: body-level, viewport-anchored fixed bg layer, static in the
         HTML (not Vue-rendered) so it paints at first paint, before #app.
         See global.css #app-bg -- this is the ONLY element that paints the
         mandala; it replaces the old #app::before approach, which rode up
         with the root's focus-driven scroll on Android keyboard-open. -->
    <div id="app-bg" aria-hidden="true"></div>
    <!-- Vue mounts here. Like FastAPI's app = FastAPI(). -->
    <div id="app"></div>
    <!-- Vite injects the <script> tag during build. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
