# =============================================================================
# VELO Frontend -- Internal Nginx (inside Docker container)
# =============================================================================
#
# Serves static files from /usr/share/nginx/html on port 3000.
# SPA fallback: any path that doesn't match a file -> index.html
# (so Vue Router history mode works).
#
# This is NOT the external Nginx on the host (that one handles SSL).
# =============================================================================

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Static assets with long cache (Vite adds hash to filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Icons (the manifest has its own location below).
    location /icons/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Background image.
    location /bg/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Files that NAME the current build: never kept stale (BE-149). ------
    # A phone that keeps an old index.html keeps asking for the old build's
    # chunks; an old sw.js keeps an old precache alive; an old manifest keeps
    # an old install identity. `no-cache` = store, but revalidate every use
    # (ETag / Last-Modified make that a cheap 304), so a deploy is seen on the
    # next request. Exact-match locations win over the prefix ones, and the SPA
    # fallback below ends in an INTERNAL redirect to /index.html that is
    # matched again -- so every client-side route gets these headers too.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # The stock mime.types has no .webmanifest; without this the manifest
    # would go out as the default type instead of its own.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: try the file, then the directory, then index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
