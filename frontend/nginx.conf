# =============================================================================
# VELO Frontend -- Internal Nginx (inside Docker container)
# =============================================================================
#
# Serves static files from /usr/share/nginx/html on port 3000.
# SPA fallback: any path that doesn't match a file -> index.html
# (so Vue Router history mode works).
#
# Under the deploy machine (primer era, FE-129/FE-149) this container owns the
# whole public domain, and with it three duties the host nginx used to have:
#   - the runtime instance config: /config.json is rendered from the
#     container environment by the entrypoint's envsubst
#     (nginx/config.json.template) -- no instance value ever enters a build;
#   - same-origin /api path routing: the machine's host.routes lead the whole
#     domain here, path routing lives in THIS container (contract 3 rule 4);
#   - closing /health and /ready (protocol 9.3): the machine closes them on
#     its own routes; a path-routed domain must close them here.
# =============================================================================

# Cache-Control per path, in ONE place. add_header inside a location cancels
# every add_header inherited from the server level, so per-location cache
# headers would silently strip the security headers below. A map on $uri
# keeps every add_header at server level. $uri is the INTERNAL one: the SPA
# fallback below ends in an internal redirect to /index.html, so every
# client-side route gets index.html's rule. An empty value emits no header.
map $uri $velo_cache_control {
    default "";

    # Vite adds a content hash to every file name: a name never changes content.
    ~^/assets/ "public, max-age=31536000, immutable";

    # Icons and background image (hand-managed names, so a short cache).
    ~^/(icons|bg)/ "public, max-age=604800";

    # --- Files that NAME the current build: never kept stale (FE-149). ------
    # A phone that keeps an old index.html keeps asking for the old build's
    # chunks; an old sw.js keeps an old precache alive; an old manifest keeps
    # an old install identity. `no-cache` = store, but revalidate every use
    # (ETag / Last-Modified make that a cheap 304), so a deploy is seen on the
    # next request. build-info.json is the build identity (FE-149 section 3 /
    # contract 3 rule 19); config.json (FE-129) holds values of THIS container
    # start -- a restart may bring new ones.
    ~^/(index\.html|sw\.js|build-info\.json|manifest\.webmanifest|config\.json)$ "no-cache";
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (FE-157 3F). SERVER level only: never add an
    # `add_header` inside a location of this file, it would drop all of these
    # for that location. `always` = also on 404 / 5xx.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Voice input needs the microphone; the Zoom SDK needs microphone and
    # camera. Both run on the page's own origin, so (self) is enough.
    add_header Permissions-Policy "microphone=(self), camera=(self)" always;

    # CSP in REPORT-ONLY: a measurement, NOT protection -- it blocks nothing.
    # Mirrors the host template (scripts/nginx-render.sh) so both layers report
    # the same policy. Differences from it:
    #   - frame-ancestors: the Telegram web clients that embed the Mini App
    #     (web.telegram.org and its webk./webz. subdomains); desktop/mobile
    #     WebViews are not frames and are unaffected;
    #   - no report-uri yet: the CSP report endpoint (BE-203) does not exist.
    # Sources: telegram.org -- telegram-web-app.js; js.stripe.com and
    # api.stripe.com -- Stripe; *.zoom.us -- Zoom SDK; 'unsafe-inline' -- Vue
    # inline styles and the Telegram bootstrap; img https: -- remote
    # avatars/banners. Under the deploy machine the API has its own domain
    # (config.json apiBaseUrl) that connect-src does not list, so expect
    # reports for it until the policy is rendered from the environment.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org https://*.telegram.org https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.telegram.org https://api.stripe.com https://*.zoom.us; frame-src https://js.stripe.com https://*.zoom.us; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;

    # Cache-Control from the map above. No `always`: a 404 must not be cached
    # as immutable. One header -- no `expires` doubling it.
    add_header Cache-Control $velo_cache_control;

    # Gzip compression for faster loading.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Static prefixes: a missing file is a real 404, NOT the SPA fallback (a
    # stale chunk URL must not receive index.html with a 200). Their
    # Cache-Control comes from the map.
    location /assets/ { }
    location /icons/ { }
    location /bg/ { }

    # The stock mime.types has no .webmanifest; without this the manifest
    # would go out as the default type instead of its own.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    # --- Same-origin API: the local-dev / interim-stand path only. Under the
    # deploy machine the API has its own domain (owner 09.11, primer.yaml
    # `domains: [frontend, api]`) and the app calls it absolutely; this
    # location then simply stays unused. proxy_pass WITHOUT a URI
    # part forwards the original URI: /api/v1/... reaches the backend exactly
    # as the app sends it. X-Real-IP is deliberately NOT overridden: the
    # machine's nginx already set it and the backend reads it itself (BE-40,
    # --no-proxy-headers); $remote_addr HERE would be the machine's proxy
    # hop, i.e. the wrong client. 300s: long API requests (voice
    # transcription) route through this hop too.
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # --- Health endpoints belong to the machine, read over the internal
    # network (protocol 9.3). With path routing inside this container the
    # closure is this container's job; without it they answered the SPA
    # fallback with a 200.
    location = /health {
        return 404;
    }

    location = /ready {
        return 404;
    }

    # SPA fallback: try the file, then the directory, then index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
