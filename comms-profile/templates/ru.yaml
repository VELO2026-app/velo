# =============================================================================
# VELO -- comms product profile: templates, locale "ru"
# =============================================================================
#
# Converted from the velo donor sheet
# (backend/app/modules/notifications/templates/ru.yaml): the donor's
# flat {type: {title, body}} re-laid into the canonical three-level
# comms form {type: {channel: {field: str}}} (arch doc §2.3), donor
# type names renamed to the dot-notation dictionary §2.
#
# Deliberate deviations from a mechanical conversion (T0 report §1):
#   - booking.cancelled_by_user: the donor text addressed the BOOKER
#     ("Ваше бронирование отменено"), but per dictionary §2 the event
#     is addressed to the MASTER -- the text is re-aimed accordingly.
#   - master.application_received: NEW type (group:admins), no donor.
#   - msg.*: comms-native chat types; pass-through sheets (the
#     messaging engine supplies title/body), mirroring the smoke
#     profile shape.
#
# Composition note (dispatch plan §6b): titles are NOT auto-bolded by
# comms -- the sheet owns markup. Donor titles were plain and stay
# plain; bodies carry their donor <b> markup as-is.
#
# YAML TRAP: every value containing {braces} MUST be quoted -- a bare
# `body: {title}` parses as a flow mapping, not a string.
# NO external domains anywhere (comms startup fence, decision 13).
# =============================================================================

# -- Bookings --

booking.confirmed:
  telegram:
    title: "Бронирование подтверждено"
    body: "✅ Ваше бронирование на <b>{practice_title}</b> подтверждено.\n\n📅 {scheduled_at}\n👤 Мастер: {master_name}\n💰 Оплачено: €{paid_amount}"

booking.cancelled_by_user:
  telegram:
    title: "Участник отменил бронирование"
    body: "❌ Участник отменил бронирование на <b>{practice_title}</b>.\n\n📅 {scheduled_at}"

# -- Practices --

practice.cancelled:
  telegram:
    title: "Практика отменена"
    body: "❌ Практика <b>{practice_title}</b> {scheduled_at} отменена.\n\n💰 Оплата возвращена на ваш баланс."

practice.rescheduled:
  telegram:
    title: "Практика перенесена"
    body: "📝 Практика <b>{practice_title}</b> перенесена.\n\n📅 Новое время: {scheduled_at}\n👤 Мастер: {master_name}"

practice.cancelled_waitlist:
  telegram:
    title: "Практика отменена"
    body: "❌ Практика <b>{practice_title}</b> {scheduled_at}, на которую вы стояли в листе ожидания, отменена."

# BE-21: to the practice's OWN master, when a school curator cancelled it.
practice.cancelled_by_curator:
  telegram:
    title: "Вашу практику отменили"
    body: "❌ Практику <b>{practice_title}</b> {scheduled_at} отменил куратор школы <b>{group_name}</b>.\n\n💰 Участникам возвращена оплата."

# -- Waitlist --

waitlist.spot_available:
  telegram:
    title: "Место освободилось!"
    body: "🎉 Освободилось место на <b>{practice_title}</b>!\n\n📅 {scheduled_at}\n👤 Мастер: {master_name}\n\n⏳ У вас <b>30 минут</b> на подтверждение.\nНажмите кнопку, чтобы забронировать."

waitlist.expired:
  telegram:
    title: "Лист ожидания истёк"
    body: "⏳ Ваша запись в листе ожидания на <b>{practice_title}</b> истекла.\n\n📅 {scheduled_at}"

# -- Master account status --

master.verified:
  telegram:
    title: "Заявка одобрена"
    body: "🎉 Поздравляем! Ваша заявка мастера одобрена.\n\nТеперь вы можете создавать и управлять практиками."

master.rejected:
  telegram:
    title: "Заявка отклонена"
    body: "Ваша заявка мастера была рассмотрена и, к сожалению, не была одобрена.\n\nВы можете подать новую заявку."

master.application_received:
  telegram:
    title: "Новая заявка мастера"
    body: "📨 Поступила новая заявка на статус мастера.\n\n👤 {applicant_name}"

# -- Wallet --

wallet.topup_confirmed:
  telegram:
    title: "Пополнение подтверждено"
    body: "💰 Ваш баланс пополнен на <b>€{amount}</b>.\n\nТекущий баланс: €{balance}"

wallet.withdrawal_approved:
  telegram:
    title: "Вывод средств одобрен"
    body: "💸 Ваш вывод <b>€{amount}</b> одобрен и обрабатывается."

wallet.withdrawal_rejected:
  telegram:
    title: "Вывод средств отклонён"
    body: "Ваш запрос на вывод €{amount} не был одобрен.\n\nПричина: {reason}"


# -- Booking reminders (T1; donor reminder_* series re-keyed) --

booking.reminder_24h:
  telegram:
    title: "Практика завтра"
    body: "⏰ Напоминание: <b>{practice_title}</b> начнётся через 24 часа.\n\n📅 {scheduled_at}\n👤 Мастер: {master_name}"

booking.reminder_1h:
  telegram:
    title: "Практика через 1 час"
    body: "⏰ <b>{practice_title}</b> начнётся через 1 час!\n\n📅 {scheduled_at}\n👤 Мастер: {master_name}"

booking.reminder_10m:
  telegram:
    title: "Практика скоро начнётся"
    body: "🔔 <b>{practice_title}</b> начнётся через 10 минут!\n\n👤 Мастер: {master_name}"

# -- Post-practice prompts --

prompt.leave_review:
  telegram:
    title: "Как прошла практика?"
    body: "📝 Вы посетили <b>{practice_title}</b> с {master_name}.\n\nНажмите, чтобы оставить отзыв и помочь другим ученикам."

prompt.leave_feedback:
  telegram:
    title: "Поделитесь впечатлениями"
    body: "📝 Как вам <b>{practice_title}</b>?\n\nВаши впечатления помогают мастерам делать практики лучше."

# -- System --

system.announcement:
  telegram:
    title: "{title}"
    body: "{body}"

# -- Chat baseline (pass-through; messaging engine supplies texts) --

msg.participant_message:
  telegram:
    title: "{title}"
    body: "{body}"

msg.support_message:
  telegram:
    title: "{title}"
    body: "{body}"

msg.thread_closed:
  telegram:
    title: "{title}"
    body: "{body}"

# BE-25: school notifications. Every one is addressed to a single person who
# is a party to the event itself -- nobody learns a school exists from these.
curator_group.transfer_offered:
  telegram:
    title: "Вам предлагают школу"
    body: "🏛 <b>{actor_name}</b> предлагает вам стать куратором школы <b>{group_name}</b>.\n\nОткройте приложение, чтобы принять или отклонить."

curator_group.transfer_accepted:
  telegram:
    title: "Школа передана"
    body: "🏛 <b>{actor_name}</b> принял школу <b>{group_name}</b>. Вы больше не её куратор."

curator_group.transfer_declined:
  telegram:
    title: "Передача отклонена"
    body: "🏛 <b>{actor_name}</b> отклонил передачу школы <b>{group_name}</b>. Школа осталась за вами."

curator_group.member_removed:
  telegram:
    title: "Вы больше не в школе"
    body: "🏛 Вас удалили из школы <b>{group_name}</b>. Её практики больше не отображаются."

curator_group.member_joined:
  telegram:
    title: "Новый участник школы"
    body: "🏛 <b>{actor_name}</b> вступил в школу <b>{group_name}</b>."

# GT-27: appointing a school master. The offer goes to the candidate, both
# outcomes go back to the curator who made it.
curator_group.master_offered:
  telegram:
    title: "Вас приглашают вести школу"
    body: "🏛 <b>{actor_name}</b> предлагает вам стать мастером школы <b>{group_name}</b>.\n\nОткройте приложение, чтобы принять или отклонить."

curator_group.master_offer_accepted:
  telegram:
    title: "Назначение принято"
    body: "🏛 <b>{actor_name}</b> принял назначение мастером школы <b>{group_name}</b>."

curator_group.master_offer_declined:
  telegram:
    title: "Назначение отклонено"
    body: "🏛 <b>{actor_name}</b> отклонил назначение мастером школы <b>{group_name}</b>."

# -- Master-facing (BE-33) --
#
# {mood} and {rating} arrive as an EMOJI, never as the stored 1..10 score
# (diary/notify_master.py). A bucket token would read as an English
# word inside a Russian sheet; the emoji is the same in both locales and is
# the vocabulary these sheets already speak.

practice.master_reminder_1h:
  telegram:
    title: "Ваша практика через 1 час"
    body: "⏰ Вы ведёте <b>{practice_title}</b> через 1 час.\n\n📅 {scheduled_at}"

practice.checkin_received:
  telegram:
    title: "Новый чек-ин"
    body: "{mood} {participant_name} отметился перед практикой <b>{practice_title}</b>.\n\n{comment}"

practice.feedback_received:
  telegram:
    title: "Новый отзыв"
    body: "{rating} {participant_name} оставил отзыв о практике <b>{practice_title}</b>.\n\n{comment}"
