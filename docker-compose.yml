# =============================================================================
# VELO -- the stack `velo` of primer.yaml (deploy machine pridem)
# =============================================================================
#
# The machine names the compose project (-p), the volumes and networks, labels
# the containers, routes the internet in through its own nginx and keeps the
# logs: none of that is written here (protocol 3.1, 3.5). Every value comes
# from the machine through `--env-file`, written as ${VAR:?} -- no defaults,
# no env_file, no build.args (protocol 3.4, contract 3 rule 18).
#
# Services: app (FastAPI), frontend (the SPA behind nginx), postgres, redis.
# Object storage is the stack `velo-storage` (docker-compose.storage.yml).
# =============================================================================

services:
  app:
    build:
      # The repository root (backend/Dockerfile says why); what the context
      # carries is backend/Dockerfile.dockerignore. The stage `test` of the
      # same Dockerfile is primer.yaml's test.target.
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    # Every key here is a field of the backend's Settings (EDITION: from
    # BE-182), and every field without a default is a key here
    # (backend/tests/test_primer_env.py): a key Settings does not read would
    # be ignored without a word.
    environment:
      # The role of the server (test | preview | prod); the backend decides
      # from it whether payments run on the stub.
      SERVER_ROLE: ${SERVER_ROLE:?}
      EDITION: ${EDITION:?}
      DATABASE_URL: postgresql+asyncpg://velo:${POSTGRES_PASSWORD:?}@postgres:5432/velo
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      # Hosts of the instance's domains, not origins: the backend adds https://
      # (contract 3 rule 18).
      DOMAIN_FRONTEND: ${DOMAIN_FRONTEND:?}
      DOMAIN_API: ${DOMAIN_API:?}
      SUPPORT_LANGUAGE: ${SUPPORT_LANGUAGE:?}
      # Channels in transition: they leave with their hosts in egress.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:?}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:?}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:?}
      ZOOM_SDK_CLIENT_ID: ${ZOOM_SDK_CLIENT_ID:?}
      ZOOM_SDK_CLIENT_SECRET: ${ZOOM_SDK_CLIENT_SECRET:?}
      TELEGRAM_LOGIN_CLIENT_ID: ${TELEGRAM_LOGIN_CLIENT_ID:?}
      TELEGRAM_LOGIN_CLIENT_SECRET: ${TELEGRAM_LOGIN_CLIENT_SECRET:?}
      # Seams of comms.
      COMMS_API_URL: ${COMMS_API_URL:?}
      COMMS_SERVICE_TOKEN: ${COMMS_SERVICE_TOKEN:?}
      TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:?}
      # The point of comms: address <alias>:<port> and password by seam, the
      # URL is put together here (protocol 4.4).
      COMMS_REDIS_URL: redis://:${COMMS_EVENTS_PASSWORD:?}@${COMMS_EVENTS_ADDRESS:?}/0
      # The backend's own key to velo-storage.
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    # Read by the SPA at the start of the container, not at the build
    # (contract 3 rule 19): one image for every instance of a commit.
    environment:
      API_BASE_URL: ${API_BASE_URL:?}
      TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:?}
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  postgres:
    # Locale is NOT pinned on purpose: the cluster inherits the image default
    # (en_US.utf8), and lower() of Cyrillic depends on it -- the guard is
    # test_three_spellings_are_one_name_in_its_freshest_form. BE-157: pinned
    # by the INDEX digest (PostgreSQL 16.15, Debian 13 trixie, glibc 2.41);
    # another glibc needs datcollversion compared before the rollout.
    image: postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_USER: velo
      POSTGRES_DB: velo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - velo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velo -d velo"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    # BE-157: pinned by the INDEX digest (Redis 7.4.11, Alpine 3.21).
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    # The password reaches redis-server and redis-cli from the environment,
    # never from a file of the host.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - velo_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$REDIS_PASSWORD; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  velo_postgres_data: {}
  velo_redis_data: {}
