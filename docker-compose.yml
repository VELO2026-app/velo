# =============================================================================
# VELO Platform -- Docker Compose (root, CRITICAL-4: Redis auth)
# =============================================================================
#
# Single compose file for the entire stack:
#   - app:       FastAPI backend (Python)
#   - frontend:  Vue SPA served by Nginx (static files)
#   - postgres:  Database
#   - redis:     Cache / sessions (password-protected)
#
# Usage:
#   velo update   -- pull, build, migrate, test, restart
#   velo test     -- run tests inside container
#   velo status   -- health check
#
# Note: docker-compose.yml lives in repo root because it manages
# both backend/ and frontend/ build contexts.
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: ./backend
    container_name: velo-app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    # The backend is the ONLY velo service that talks to comms (the comms
    # API is internal, reachable by service name on aivis-shared only).
    # `default` is listed explicitly: once a service carries a `networks:`
    # key, compose stops attaching it to the default network implicitly.
    networks:
      - default        # intra-velo traffic, unchanged
      - aivis-shared   # reach comms-app / comms-redis by name

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL
        - VITE_TELEGRAM_BOT_URL
    container_name: velo-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:16
    container_name: velo-postgres
    # NARROW env (T-32 item 9): the four keys this container actually
    # consumes, projected out of backend/.env by scripts/env-render.sh
    # (install_velo.sh on install, velo-manage.sh on update). It used to
    # read ./backend/.env -- the WHOLE product env -- so `docker compose
    # exec postgres env` printed Stripe keys, the bot token, SECRET_KEY
    # and COMMS_SERVICE_TOKEN. backend/.env stays the single source of
    # these passwords; .env.db is derived, never edited.
    env_file:
      - ./backend/.env.db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - velo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velo -d velo"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: velo-redis
    # NARROW env (T-32 item 9), same file as postgres above. redis needs
    # exactly REDIS_PASSWORD -- for `command` and for the healthcheck --
    # and nothing else. Compromising redis is no longer compromising
    # every application secret on the box.
    env_file:
      - ./backend/.env.db
    # CRITICAL-4: Start Redis with password from .env.
    # In development (REDIS_PASSWORD=change-me or empty), still works --
    # clients must include password in REDIS_URL.
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
      else
        redis-server --appendonly yes;
      fi'
    volumes:
      - velo_redis_data:/data
    healthcheck:
      # CRITICAL-4: Use REDISCLI_AUTH env var for authenticated ping.
      # Docker passes REDIS_PASSWORD from env_file; redis-cli reads
      # REDISCLI_AUTH automatically (no password in CLI args).
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$REDIS_PASSWORD; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

volumes:
  velo_postgres_data:
  velo_redis_data:

networks:
  # Shared bus between the velo stack and the comms stack. EXTERNAL: it is
  # created idempotently by install_velo.sh (ensure_shared_network) and/or
  # by comms-deploy.sh install -- either side may create it first, the
  # result is identical. Compose requires it to exist before `up`.
  # frontend/postgres/redis stay on the implicit default network only.
  aivis-shared:
    external: true
