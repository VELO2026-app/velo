# =============================================================================
# VELO CI — the deterministic gate (factory Phase 1, docs/ai-dev-factory-tz.md §8.4)
#
# Two jobs, no agents, no judgment:
#   frontend    — the FE-73 zero-warning budget + prettier + vitest + vue-tsc
#                 build, mirroring the pre-push hook (closes --no-verify).
#   drift-check — regenerate frontend/src/api/generated.ts from the app's own
#                 OpenAPI schema and fail on any diff. Read-only w.r.t. the
#                 backend. The generator is deterministic by contract
#                 (backend/scripts/generate_ts_types.py).
#
# The BACKEND lint gate (ruff) is deliberately absent: the backend is
# owned outside this contour — first CI run measured 383 ruff errors at the
# lockfile-range ruff, and wiring that gate (pinning ruff, fixing or scoping
# findings) belongs to the backend owner. Add the job when they green-light it.
# The backend pytest suite is not here either: on branch deploy-machine it
# runs in its own workflow, backend-tests.yml (BE-197); on test the stand
# runs it on every rollout.
#
# Toolchain pins: pnpm 12.4.2 (mirrors frontend/package.json `packageManager`);
# python 3.12 in the drift job keeps generated.ts stable.
# =============================================================================
name: CI

on:
  push:
    branches: [test, deploy-machine]
  pull_request:
    branches: [test, deploy-machine]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend — lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Explicit: the action reads `packageManager` from a root package.json,
          # and ours lives in frontend/ — see the failed first run.
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (zero-warning budget)
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build (vue-tsc + vite)
        run: pnpm build

  drift-check:
    name: generated.ts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The lock the backend image installs (backend/Dockerfile, builder):
      # the schema is generated by the same versions that serve it.
      - name: Install deps (backend/requirements.txt; runtime deps only)
        working-directory: backend
        run: 'pip install --no-cache-dir --require-hashes --only-binary :all: -r requirements.txt'

      - name: Regenerate generated.ts from the app's OpenAPI schema
        working-directory: backend
        # app.main builds Settings at import: every required key (BE-192),
        # invented -- the schema reads none of them.
        env:
          SERVER_ROLE: test
          DATABASE_URL: postgresql+asyncpg://velo:velo@localhost:5432/velo
          DOMAIN_FRONTEND: app.velo-ci.invalid
          DOMAIN_API: api.velo-ci.invalid
          TELEGRAM_BOT_TOKEN: 123456:velo-ci-bot-token
          TELEGRAM_LOGIN_CLIENT_ID: '123456'
          TELEGRAM_LOGIN_CLIENT_SECRET: velo-ci-login-secret
          ZOOM_ACCOUNT_ID: velo-ci-zoom-account
          ZOOM_CLIENT_ID: velo-ci-zoom-client
          ZOOM_CLIENT_SECRET: velo-ci-zoom-secret
          ZOOM_SDK_CLIENT_ID: velo-ci-zoom-sdk-client
          ZOOM_SDK_CLIENT_SECRET: velo-ci-zoom-sdk-secret
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "import json; from app.main import app; json.dump(app.openapi(), open('openapi.json', 'w'))"
          python scripts/generate_ts_types.py openapi.json ../frontend/src/api/generated.ts

      - name: Fail on drift
        run: git diff --exit-code -- frontend/src/api/generated.ts
