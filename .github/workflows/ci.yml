# =============================================================================
# VELO CI — the deterministic gate (factory Phase 1, docs/ai-dev-factory-tz.md §8.4)
#
# Two jobs, no agents, no judgment:
#   frontend    — the FE-73 zero-warning budget + prettier + vitest + vue-tsc
#                 build, mirroring the pre-push hook (closes --no-verify).
#                 Since FE-116 the job is the WORKSPACE gate: it installs the
#                 pnpm workspace at the repo root, runs the application's
#                 lint (which also polices packages/velo-ui) and builds the
#                 @velo/ui package alongside the app.
#   drift-check — regenerate frontend/src/api/generated.ts from the app's own
#                 OpenAPI schema and fail on any diff. Read-only w.r.t. the
#                 backend. The generator is deterministic by contract
#                 (backend/scripts/generate_ts_types.py).
#
# The BACKEND gate (ruff / pytest) is deliberately absent: the backend is
# owned outside this contour — first CI run measured 383 ruff errors at the
# lockfile-range ruff, and wiring that gate (pinning ruff, fixing or scoping
# findings) belongs to the backend owner. Add the job when they green-light it.
#
# Toolchain pins: pnpm 12.4.2 (mirrors the ROOT package.json `packageManager`,
# the workspace root since FE-116); python 3.12 in the drift job keeps
# generated.ts stable.
# =============================================================================
name: CI

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend — lint / test / build (+ @velo/ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Explicit version: the action's packageManager lookup is a
          # convenience, not a guarantee — see the failed first run.
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (workspace root, frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (zero-warning budget; covers packages/ via lint-budget)
        run: pnpm -C frontend lint

      - name: Format check
        run: pnpm -C frontend format:check && pnpm -C packages/velo-ui format:check

      - name: Tests (frontend + @velo/ui)
        run: pnpm -r test

      - name: Build @velo/ui (vite lib + vue-tsc dts)
        run: pnpm -C packages/velo-ui build

      - name: Build (vue-tsc + vite)
        run: pnpm -C frontend build

  drift-check:
    name: generated.ts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps (same Dockerfile pattern; base deps only)
        working-directory: backend
        run: |
          tmp=$(mktemp -d)
          cp pyproject.toml "$tmp/"
          pip install --no-cache-dir "$tmp"

      - name: Regenerate generated.ts from the app's OpenAPI schema
        working-directory: backend
        env:
          APP_ENV: development
          PUBLIC_LINK_BASE: http://localhost:8000
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "import json; from app.main import app; json.dump(app.openapi(), open('openapi.json', 'w'))"
          python scripts/generate_ts_types.py openapi.json ../frontend/src/api/generated.ts

      - name: Fail on drift
        run: git diff --exit-code -- frontend/src/api/generated.ts
