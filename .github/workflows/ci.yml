# =============================================================================
# VELO CI — the deterministic gate (factory Phase 1, docs/ai-dev-factory-tz.md §8.4)
#
# Three jobs (scope + the two gates), no agents, no judgment:
#   frontend    — the FE-73 zero-warning budget + prettier + vitest + vue-tsc
#                 build, mirroring the pre-push hook (closes --no-verify).
#                 Since FE-116 the job is the WORKSPACE gate: it installs the
#                 pnpm workspace at the repo root, runs the application's
#                 lint (which also polices packages/velo-ui) and builds the
#                 @velo/ui package alongside the app, then runs the
#                 whitelabel build-matrix gate (FE-114).
#   drift-check — regenerate frontend/src/api/generated.ts from the app's own
#                 OpenAPI schema and fail on any diff. Read-only w.r.t. the
#                 backend. The generator is deterministic by contract
#                 (backend/scripts/generate_ts_types.py).
#
# The BACKEND gate (ruff / pytest) is deliberately absent: the backend is
# owned outside this contour — first CI run measured 383 ruff errors at the
# lockfile-range ruff, and wiring that gate (pinning ruff, fixing or scoping
# findings) belongs to the backend owner. Add the job when they green-light it.
#
# Scope (per PR type): a `scope` job classifies the PR's diff
# (.github/scripts/ci-scope.mjs) and the jobs below size themselves:
#   docs-only PR            -> frontend + drift skipped (green in seconds)
#   comment-only code edits -> frontend runs lint + format only
#   backend/**              -> drift; frontend skipped unless touched too
#   anything else           -> the full gate
# Pushes to test always run the full gate -- the trunk is the backstop.
# Skipped jobs report "skipped", which satisfies a required status check.
#
# Toolchain pins: pnpm 12.4.2 (mirrors the ROOT package.json `packageManager`,
# the workspace root since FE-116); python 3.12 in the drift job keeps
# generated.ts stable.
# =============================================================================
name: CI

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend || 'full' }}
      drift: ${{ steps.scope.outputs.drift || 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          # The PR merge commit + its first parent (the base tip): the diff
          # between them is exactly what the PR contributes.
          fetch-depth: 2

      - name: Classify the PR diff
        id: scope
        if: github.event_name == 'pull_request'
        run: node .github/scripts/ci-scope.mjs HEAD^1 HEAD

  frontend:
    name: frontend — lint / test / build (+ @velo/ui)
    needs: scope
    if: needs.scope.outputs.frontend != 'skip'
    runs-on: ubuntu-latest
    env:
      FULL: ${{ needs.scope.outputs.frontend == 'full' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Explicit version: the action's packageManager lookup is a
          # convenience, not a guarantee — see the failed first run.
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (workspace root, frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (zero-warning budget; covers packages/ via lint-budget)
        run: pnpm -C frontend lint

      - name: Format check
        run: pnpm -C frontend format:check && pnpm -C packages/velo-ui format:check

      - name: Tests (frontend + @velo/ui)
        if: env.FULL == 'true'
        run: pnpm -r test

      - name: Build @velo/ui (vite lib + vue-tsc dts)
        if: env.FULL == 'true'
        run: pnpm -C packages/velo-ui build

      # FE-153: the build log is gated too -- a cyclic cross-chunk re-export
      # (broken chunk execution order) or an undefined VITE_ html placeholder
      # fails the job (rules: frontend/scripts/lib/build-log-gate.mjs).
      # pipefail is explicit: a step without `shell:` runs as `bash -e`,
      # where `build | tee` would take tee's exit 0 and hide a failed build.
      - name: Build (vue-tsc + vite) + build-log gate
        if: env.FULL == 'true'
        run: |
          set -o pipefail
          pnpm -C frontend build 2>&1 | tee "$RUNNER_TEMP/frontend-build.log"
          node frontend/scripts/build-log-gate.mjs "$RUNNER_TEMP/frontend-build.log"

      # tz-whitelabel F5 (FE-114, FE-152): the build matrix IS the whitelabel
      # gate -- golden x every edition of editions.json through PRIMER_EDITION
      # (the machine's channel): a module outside the edition must leave NO
      # chunks in dist (core: no ai, no payments) -- plus every skins/<name>
      # x full (brand + tokens from the skin, none of them in golden). One
      # vite build per cell; --no-restore skips the pointless final rebuild.
      # Runs AFTER the plain build so a red matrix reads as the whitelabel
      # gate failing, not as "the app does not build".
      - name: Build matrix (whitelabel gate)
        if: env.FULL == 'true'
        run: pnpm -C frontend build:matrix --no-restore

  drift-check:
    name: generated.ts drift
    needs: scope
    if: needs.scope.outputs.drift == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install deps (same Dockerfile pattern; base deps only)
        working-directory: backend
        run: |
          tmp=$(mktemp -d)
          cp pyproject.toml "$tmp/"
          pip install --no-cache-dir "$tmp"

      - name: Regenerate generated.ts from the app's OpenAPI schema
        working-directory: backend
        env:
          APP_ENV: development
          PUBLIC_LINK_BASE: http://localhost:8000
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          python -c "import json; from app.main import app; json.dump(app.openapi(), open('openapi.json', 'w'))"
          python scripts/generate_ts_types.py openapi.json ../frontend/src/api/generated.ts

      - name: Fail on drift
        run: git diff --exit-code -- frontend/src/api/generated.ts
