# =============================================================================
# VELO -- e2e sweep on a real backend (FE-161)
# =============================================================================
#
# Every route of the frontend router under every role, against the real
# backend seeded with the `e2e` profile, under the crash detector
# (frontend/e2e/, docs/agents/e2e.md). Two entry points:
#
#   workflow_call  -- from ci.yml on every PR and push (Chromium only): the
#                     sweep and sweep-layout (FE-240: Telegram fullscreen on
#                     an iPhone, the layout detector at three screen sizes).
#                     Blocking (FE-222): a red sweep fails this job and the
#                     gate of ci.yml. There is no advisory switch; a screen
#                     that fails for a known reason is quarantined in
#                     frontend/e2e/sweep/routes.ts (docs/testing.md).
#   schedule       -- nightly on the default branch (deploy-machine):
#                     Chromium (Telegram on Android), sweep-layout and WebKit
#                     (Telegram on iOS).
#   workflow_dispatch -- by hand, either set.
#
# The stack: Postgres 16 and Redis 7 as job services (the majors and images of
# docker-compose.yml), the backend installed with pip (not the app image: its
# build is slower than the whole sweep), the comms stub, uvicorn on :8000, the
# build with the synthetic skin package (make-test-skin.mjs) under `vite
# preview` (its /api proxy goes to :8000).
# Telegram: a fake bot token and the comms stub; Stripe: the stub of SERVER_ROLE=test;
# Zoom: no stub since BE-192, so a meeting create at seed time fails against zoom.us
# with the invented keys of ci.env (the practice is seeded without a link) -- the
# pollers are off, nothing else calls out.
# =============================================================================
name: e2e sweep

on:
  workflow_call:
    inputs:
      projects:
        type: string
        default: sweep
  schedule:
    # 02:30 UTC, after the day's merges.
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      projects:
        type: string
        default: sweep sweep-layout sweep-webkit

permissions:
  contents: read

jobs:
  # FE-240: one job per Playwright project, in parallel, each with its own
  # stack. Together in one job sweep + sweep-layout took more than twice the
  # sweep alone; apart, the wall time stays that of the longest project.
  plan:
    name: e2e-stack — plan
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      projects: ${{ steps.split.outputs.projects }}
    steps:
      - id: split
        env:
          # The schedule has no inputs: both engines and the layout sweep.
          PROJECTS: ${{ inputs.projects || 'sweep sweep-layout sweep-webkit' }}
        run: echo "projects=$(jq -cn --arg p "$PROJECTS" '$p | split(" ") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  sweep:
    name: e2e-stack — ${{ matrix.project }} on a real backend
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    services:
      postgres:
        image: postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: velo
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: velo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U velo" --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://velo:velo@127.0.0.1:5432/velo
      REDIS_URL: redis://127.0.0.1:6379/0
      # Fake on purpose: the backend checks initData with this same token, and
      # frontend/e2e/stack/auth.ts (the Sweep step) signs with it. The bring-up
      # step re-exports it after sourcing backend/ci.env, which has its own.
      TELEGRAM_BOT_TOKEN: 'e2e:fake'
      # STORAGE_*: the backend's Settings require them (nothing here reaches a
      # storage); the build identity the image's ENV carries elsewhere.
      STORAGE_ENDPOINT: http://127.0.0.1:9000
      STORAGE_SECRET_KEY: e2e-no-storage
      PRIMER_RELEASE: ci
      PRIMER_COMMIT: ${{ github.sha }}
      # Invite screens need it: the backend mints t.me links from it.
      TELEGRAM_BOT_URL: https://t.me/velo_e2e_bot
      COMMS_API_URL: http://127.0.0.1:8899
      COMMS_SERVICE_TOKEN: e2e-comms
      COMMS_RELAY_ENABLED: 'false'
      # Zoom has no stub on any role (BE-192) and ci.env carries invented Zoom
      # keys: keep the two background pollers from calling zoom.us with them.
      ZOOM_RETRY_ENABLED: 'false'
      ZOOM_REPORT_ENABLED: 'false'
      E2E_LOG_DIR: ${{ github.workspace }}/stack-logs
      # This job's one project (the plan job splits the list).
      PROJECTS: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The lock the backend image installs (same as drift-check).
      - name: Install the backend (backend/requirements.txt)
        working-directory: backend
        run: 'pip install --no-cache-dir --require-hashes --only-binary :all: -r requirements.txt'

      # backend/ci.env is the one settings environment of CI (SERVER_ROLE=test,
      # EDITION, OPTION_*, domains, languages, invented secrets); this job adds
      # its addresses (above). Sourced FIRST; the job's TELEGRAM_BOT_TOKEN then
      # wins over the one in ci.env, so the backend and the sweep agree.
      - name: Bring up the stack (migrate, seed e2e, comms stub, uvicorn)
        run: |
          token=$TELEGRAM_BOT_TOKEN
          set -a; . backend/ci.env; set +a
          export TELEGRAM_BOT_TOKEN="$token"
          sh frontend/e2e/stack/up.sh

      - uses: pnpm/action-setup@v5
        with:
          version: 12.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (workspace root, frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Resolve the Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-stack-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ contains(env.PROJECTS, 'webkit') && 'webkit' || 'chromium' }}

      - name: Install the browsers (cache miss)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium ${{ contains(env.PROJECTS, 'webkit') && 'webkit' || '' }}

      # FE-204: Chromium's libraries ship with ubuntu-latest (Google Chrome);
      # only WebKit (the nightly) needs the apt step on a cache hit. A
      # missing library fails the browser launch, never passes silently.
      - name: Install the WebKit system libraries (cache hit)
        if: steps.browser-cache.outputs.cache-hit == 'true' && contains(env.PROJECTS, 'webkit')
        working-directory: frontend
        run: pnpm exec playwright install-deps webkit

      # FE-204: vite only -- this job needs the dist. vue-tsc runs in the
      # typecheck job and the skin validation in the build job. FE-230: with
      # the synthetic skin package, as the smoke job in ci.yml.
      - name: Build the app (synthetic skin)
        run: |
          node frontend/scripts/make-test-skin.mjs frontend/public/skin
          pnpm -C frontend exec vite build

      - name: Sweep
        working-directory: frontend
        run: pnpm e2e:sweep:ci $(printf -- '--project=%s ' $PROJECTS)

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            frontend/test-results
            stack-logs
          retention-days: 7
