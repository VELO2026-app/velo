# =============================================================================
# VELO CI -- visual comparison of base and head on both skins (FE-162; its own
# workflow since FE-206; a verdict since FE-234)
#
# Key screens of the head and the base build from recorded API answers,
# pixel-compared, once per brand skin (gold = velo-brand, goodo-brand). STRICT
# by default: any changed screen on either skin fails the job. A change the
# author means to make is confirmed with the label `visual-change`, put on by
# a human (an agent does not label it, like `bundle-growth`): with it the
# comparison still runs and the report is the evidence, the job stays green.
# The label counts only when it was put on after the head commit: a later
# push is strict again (.github/scripts/visual-decide.mjs; docs/agents/e2e.md).
#
# `visual — verdict` is the one status to require (docs/ci/deploy-machine-
# ruleset.md). It ALWAYS runs, under a fixed name, and fails when the scope
# job failed or the comparison ran and did not pass. The comparison jobs
# carry the skin in their names and are skipped on a PR that touches no
# visual path; a check required by such a name would wait in Expected
# forever (FE-206), the verdict has none of that.
#
# Every event (opened / synchronize / reopened, any label put on or taken off)
# runs the whole workflow, and the newest event of a PR wins. Not narrowed to
# the `visual-change` label on purpose: a run that skipped the verdict on
# "another label" would shadow the real verdict in the merge box (the latest
# check of a name counts) -- so another label just repeats the comparison.
# =============================================================================
name: Visual

on:
  pull_request:
    branches: [test, deploy-machine]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  # Read-only: the label events, to tell a label older than the last commit.
  pull-requests: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # visual-scope decides whether the comparison runs: the PR touches a visual
  # path (VISUAL in ci-scope.mjs: styles, tokens, velo-ui, public, components
  # and views, the lockfile, the brand pins, the comparison itself) -- and
  # whether it is strict: no `visual-change` label.
  visual-scope:
    name: visual — scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      strict: ${{ steps.decide.outputs.strict }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Classify the PR diff
        id: scope
        run: node .github/scripts/ci-scope.mjs HEAD^1 HEAD

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PATHS: ${{ steps.scope.outputs.visual }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # `visual-change` relaxes the comparison only when it was put on
        # AFTER the head commit (visual-decide.mjs): a later push is strict
        # again until the label is put on once more.
        run: |
          EVENTS=$(gh api --paginate "repos/$REPO/issues/$PR/events" --jq '.[] | {event, created_at, label: .label.name}')
          HEAD_COMMITTED_AT=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.committer.date)
          export EVENTS HEAD_COMMITTED_AT
          echo "run=$PATHS" >> "$GITHUB_OUTPUT"
          node .github/scripts/visual-decide.mjs >> "$GITHUB_OUTPUT"

  # FE-162: what did the PR change on screen? The head build and the base
  # build, each shot on 19 key screens from recorded API answers
  # (frontend/e2e/visual/har, no backend), compared pixel by pixel, per skin.
  # Strict unless the PR carries `visual-change`: then a non-empty report is
  # the evidence, not a failure. The container is Playwright's own image so
  # fonts render the same every run -- its tag MUST equal @playwright/test
  # (checked below).
  #
  # The name carries the skin and, in a skipped run, "(not run)": it is not a
  # stable name, so it is NEVER required -- `visual — verdict` is.
  visual:
    name: visual — base vs head (${{ matrix.skin }})${{ needs.visual-scope.outputs.run != 'true' && ' (not run)' || '' }}
    needs: visual-scope
    if: needs.visual-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # FE-234: one comparison per brand skin (gold = velo-brand, goodo-brand),
    # at the tags of .github/brand-skins.json: a change that only shows on one
    # skin is seen on that skin. The runners work in parallel.
    strategy:
      fail-fast: false
      matrix:
        skin: [velo-brand, goodo-brand]
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit and its first parent (the base tip).
          fetch-depth: 2

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Base checkout (the PR's base tip)
        run: git worktree add --detach "$RUNNER_TEMP/base" HEAD^1

      - uses: pnpm/action-setup@v5
        with:
          version: 12.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install head (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The base has its own lockfile: a dependency upgrade is exactly what
      # this job is for.
      - name: Install base (frozen lockfile)
        working-directory: ${{ runner.temp }}/base
        run: pnpm install --frozen-lockfile

      - name: The image matches @playwright/test
        working-directory: frontend
        run: |
          v=$(pnpm exec playwright --version | awk '{print $2}')
          [ "$v" = "1.64.1" ] || { echo "playwright $v does not match the image tag v1.64.1 -- update container: above"; exit 1; }

      # FE-234: the brand packages at their pinned tags. The base build takes
      # the pins of the BASE (its own brand-skins.json when it has one): a PR
      # that raises a pin then shows what the new package changes on screen,
      # instead of building both sides with the same package.
      - name: Fetch the brand skin packages (head pins, base pins)
        env:
          BRAND_REPO_TOKEN: ${{ secrets.BRAND_REPO_TOKEN }}
        run: |
          node .github/scripts/fetch-brand-skins.mjs "$RUNNER_TEMP/brands" > /dev/null
          base_pins="$RUNNER_TEMP/base/.github/brand-skins.json"
          if [ -f "$base_pins" ]; then
            node .github/scripts/fetch-brand-skins.mjs "$RUNNER_TEMP/brands-base" --config "$base_pins" > /dev/null
          else
            cp -R "$RUNNER_TEMP/brands" "$RUNNER_TEMP/brands-base"
          fi

      # FE-204: vite only (types are the typecheck job's). FE-230: the core is
      # neutral, so both builds carry the brand package of the matrix cell
      # (FE-234; whole, as the machine copies it): a change that only shows
      # under a skin (a logo layer, a token the skin sets) must still show up
      # here. The synthetic package is the build matrix's and the sweep's.
      - name: Build head
        env:
          SKIN: ${{ matrix.skin }}
        run: |
          node frontend/scripts/apply-skin.mjs "$RUNNER_TEMP/brands/$SKIN/skin"
          pnpm -C frontend exec vite build

      - name: Build base
        working-directory: ${{ runner.temp }}/base
        env:
          SKIN: ${{ matrix.skin }}
        run: |
          node frontend/scripts/apply-skin.mjs "$RUNNER_TEMP/brands-base/$SKIN/skin"
          pnpm -C frontend exec vite build

      - name: Shoot both builds and compare
        working-directory: frontend
        env:
          VISUAL_STRICT: ${{ needs.visual-scope.outputs.strict == 'true' && '1' || '0' }}
          VISUAL_SKIN: ${{ matrix.skin }}
        run: sh e2e/visual/run.sh "$RUNNER_TEMP/base/frontend/dist" dist

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-out-${{ matrix.skin }}
          path: |
            frontend/visual-out
            frontend/test-results
          retention-days: 7

  # The status to require: always runs, one name. Red when the scope job
  # failed, or the comparison was due (a visual path) and did not pass --
  # a changed screen on a skin without `visual-change`, a build that broke, a
  # cancelled or timed-out job. Green when no visual path was touched.
  visual-verdict:
    name: visual — verdict
    needs: [visual-scope, visual]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        env:
          SCOPE: ${{ needs.visual-scope.result }}
          RUN: ${{ needs.visual-scope.outputs.run }}
          VISUAL: ${{ needs.visual.result }}
          STRICT: ${{ needs.visual-scope.outputs.strict }}
        run: |
          echo "scope=$SCOPE run=$RUN comparison=$VISUAL strict=$STRICT"
          if [ "$SCOPE" != success ]; then echo "the scope job did not succeed" >&2; exit 1; fi
          if [ "$RUN" = true ] && [ "$VISUAL" != success ]; then
            echo "the visual comparison did not pass on both skins (a changed screen needs the human-set label visual-change)" >&2
            exit 1
          fi
