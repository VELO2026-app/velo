# =============================================================================
# SERVICE REGISTRY -- what this product runs, and where each piece comes from
# =============================================================================
#
# Sourced by BOTH scripts/install_velo.sh (which puts the services on a
# fresh box) and scripts/velo-manage.sh (which keeps them updated), so
# the two can never disagree about a branch or a path. Adding an N-th
# service is ONE record here plus that service's own lifecycle script
# in its own repo -- no edit to the update cycle.
#
# THIS FILE IS CODE, not per-server config: it is tracked in git and
# byte-identical on every server of this product. What makes a server
# THIS server (domains, role, the product's own branch) lives in
# /opt/velo/velo.conf, written once at install.
#
# RECORD FORMAT (pipe-separated, order matters -- services are updated
# top to bottom, and the product goes LAST):
#
#   1 name        short id, used in output
#   2 repo        GitHub slug (owner/repo)
#   3 dir         checkout path on the box
#   4 branch      branch EXPRESSION, see below
#   5 lifecycle   path to its deploy CLI, relative to dir
#                 -- or the literal "internal" for the product itself
#   6 updater     subcommand for that CLI (or the shell function to
#                 call when lifecycle is "internal")
#   7 access      GitHub deploy-key privilege this service's repo needs:
#                 "read" or "write". Declared, never inferred -- the
#                 operator instruction is materially different ("tick
#                 Allow write access" vs "leave it unticked"), and a
#                 claim about privilege must be written down where it
#                 can be reviewed, not derived from a name. Today only
#                 the product needs write: `velo update` pushes the
#                 regenerated API types back. Services only pull.
#
# BRANCH EXPRESSIONS -- the registry says HOW to get the branch, never
# hardcodes a per-server value:
#
#   fixed:<branch>              the same branch everywhere
#   conf:<KEY>                  read <KEY> from velo.conf (per-server)
#   role:test=<b>,prod=<b>      pick by this server's VELO_ROLE
#
# WHY a fixed branch for a service, and what it costs if you change it:
# `fixed:main` means every server of every product runs the same comms.
# The format also allows a per-product branch (e.g. `fixed:comms/velo`)
# -- cheap to switch, ONE cell, no code change -- but using it starts a
# rent: every fix has to be carried to each product branch, and alembic
# revisions can fork the migration graph, which is expensive to unfork.
# If you ever do switch, keep these three rules: main stays the ANCESTOR
# of every product branch; a branch is the last resort (try the profile
# or an env knob first -- both are already per-product); and migrations
# are authored on main only. `velo update` warns when a service branch
# is not a descendant of main, so the drift is visible from day one.
# =============================================================================

# shellcheck disable=SC2034  # consumed by whoever sources this file
VELO_SERVICES=(
    "comms|aivis-one/comms|/opt/comms/repo|fixed:main|deploy/comms-deploy.sh|update|read"
    "velo|aivis-one/velo|/opt/velo/repo|conf:VELO_BRANCH|internal|update_product|write"
)

# Example -- a third service is exactly this much work (its own repo
# ships its own deploy CLI; nothing in the update cycle changes):
#
#   "billing|aivis-one/billing|/opt/billing/repo|fixed:main|deploy/billing-deploy.sh|update|read"
#
# Adding it to a FRESH server: install picks it up from this file --
# including its GitHub deploy key, which install provisions by looping
# over these records (no per-service code).
#
# Adding it to a LIVE server: reinstall. Note BOTH halves of that, they
# are not the same statement:
#   - TECHNICALLY it is now possible. Since T-33 key provisioning is a
#     loop over this file, and `velo rotate-key` already generates a
#     key, prints the web instruction and verifies it before use -- the
#     install-time-only obstacle that justified the ruling is gone.
#   - The OWNER RULING of 2026-08-04 nevertheless stands: reinstall.
#     There is deliberately no `velo add-service`. Changing that is the
#     owner'"'"'s call, not a reader'"'"'s -- do not infer permission from
#     the fact that the machinery would now allow it.
#
# LIFECYCLE VERBS -- what a service'"'"'s CLI is expected to implement:
# install, update, start, stop, restart, logs, status. velo does NOT
# assume all of them are present: it reads the CLI'"'"'s own dispatcher and
# names any verb a service does not implement (see verb_supported() in
# velo-manage.sh). A service gaining a verb needs no change here.

# Field accessor: svc_field <record> <1-based index>.
svc_field() {
    local record="$1" index="$2"
    local IFS='|'
    # shellcheck disable=SC2206  # deliberate word-splitting on IFS
    local fields=($record)
    # `:-` is load-bearing under `set -u` (install_velo.sh runs
    # `set -euo pipefail`): asking a SHORT record for a field it does
    # not carry -- a record written before field 7 existed, or one
    # copied from an older example -- would otherwise abort the whole
    # script with "unbound variable" instead of letting the caller
    # report which service is missing which field. An absent field
    # reads as empty; validating it is the caller's business.
    printf '%s' "${fields[$((index - 1))]:-}"
}

# Resolve a branch EXPRESSION against this server's config. Prints the
# branch, or fails loudly -- an unresolvable branch must never fall
# back to "whatever is checked out": that is the drift this replaced.
svc_branch() {
    local expr="$1" name="${2:-service}"
    case "$expr" in
        fixed:*)
            printf '%s' "${expr#fixed:}"
            ;;
        conf:*)
            local key="${expr#conf:}" value=""
            value="${!key:-}"
            if [ -z "$value" ]; then
                echo "FATAL: $name branch is '$expr' but $key is not set in velo.conf" >&2
                return 1
            fi
            printf '%s' "$value"
            ;;
        role:*)
            local pairs="${expr#role:}" pair
            local IFS=','
            for pair in $pairs; do
                if [ "${pair%%=*}" = "${VELO_ROLE:-}" ]; then
                    printf '%s' "${pair#*=}"
                    return 0
                fi
            done
            echo "FATAL: $name branch '$expr' has no entry for role '${VELO_ROLE:-}'" >&2
            return 1
            ;;
        *)
            echo "FATAL: $name has an unknown branch expression '$expr'" >&2
            return 1
            ;;
    esac
}
